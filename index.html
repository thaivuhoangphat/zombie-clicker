<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zombie Clicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Zombie Clicker 🧟</h1>
    <p>Click the zombie to gain score. Move your mouse and try to beat your best!</p>
  </header>

  <main>
    <canvas id="gameCanvas" width="800" height="600" aria-label="Game canvas"></canvas>
    <div id="hud">
      <span id="score">Score: 0</span>
      <button id="resetBtn" type="button">New Game</button>
    </div>
  </main>

  <footer>
    <small>Made with vanilla JS — deploys via GitHub Pages.</small>
  </footer>

  <script src="main.js"></script>
</body>
</html>
